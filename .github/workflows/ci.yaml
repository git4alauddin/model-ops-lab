name: ci

on:
  workflow_dispatch:
    inputs:
      publish_image:
        description: "Publish the serving image to Docker Hub"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  tests:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

  docker-image:
    name: docker image build
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build serving image
        run: |
          docker build \
            -f deployment/Dockerfile \
            -t modelopslab-serving:ci \
            -t modelopslab-serving:${{ github.sha }} \
            .

      - name: Validate Docker Hub secrets
        if: ${{ inputs.publish_image == 'true' }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "::error::Missing GitHub Actions secret: DOCKERHUB_USERNAME"
            exit 1
          fi

          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret: DOCKERHUB_TOKEN"
            exit 1
          fi

      - name: Login to Docker Hub
        if: ${{ inputs.publish_image == 'true' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Docker Hub image
        if: ${{ inputs.publish_image == 'true' }}
        run: |
          docker tag modelopslab-serving:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/modelopslab-serving:${{ github.sha }}
          docker tag modelopslab-serving:ci ${{ secrets.DOCKERHUB_USERNAME }}/modelopslab-serving:ci

      - name: Push Docker Hub image
        if: ${{ inputs.publish_image == 'true' }}
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/modelopslab-serving:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/modelopslab-serving:ci
