name: ci

on:
  workflow_dispatch:
    inputs:
      publish_image:
        description: "Publish the serving image to Docker Hub"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      publish_artifact_registry:
        description: "Publish the serving image to Google Artifact Registry"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      deploy_cloud_run:
        description: "Deploy the published Git SHA image to Cloud Run"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      cloud_run_image_source:
        description: "Image source for Cloud Run deployment"
        required: false
        default: "dockerhub"
        type: choice
        options:
          - "dockerhub"
          - "artifact_registry"
      gcp_project_id:
        description: "Google Cloud project ID for Cloud Run deployment"
        required: false
        default: ""
        type: string
      cloud_run_service:
        description: "Cloud Run service name"
        required: false
        default: "modelopslab-serving"
        type: string
      cloud_run_region:
        description: "Cloud Run region"
        required: false
        default: "us-central1"
        type: string
      artifact_registry_location:
        description: "Artifact Registry location"
        required: false
        default: "us-central1"
        type: string
      artifact_registry_repository:
        description: "Artifact Registry Docker repository name"
        required: false
        default: "modelopslab"
        type: string

jobs:
  tests:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

  docker-image:
    name: docker image build
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build serving image
        run: |
          docker build \
            -f deployment/Dockerfile \
            -t modelopslab-serving:ci \
            -t modelopslab-serving:${{ github.sha }} \
            .

      - name: Validate Docker Hub secrets
        if: ${{ inputs.publish_image == 'true' }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "::error::Missing GitHub Actions secret: DOCKERHUB_USERNAME"
            exit 1
          fi

          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret: DOCKERHUB_TOKEN"
            exit 1
          fi

      - name: Login to Docker Hub
        if: ${{ inputs.publish_image == 'true' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Docker Hub image
        if: ${{ inputs.publish_image == 'true' }}
        run: |
          docker tag modelopslab-serving:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/modelopslab-serving:${{ github.sha }}
          docker tag modelopslab-serving:ci ${{ secrets.DOCKERHUB_USERNAME }}/modelopslab-serving:ci

      - name: Push Docker Hub image
        if: ${{ inputs.publish_image == 'true' }}
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/modelopslab-serving:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/modelopslab-serving:ci

      - name: Validate Artifact Registry inputs
        if: ${{ inputs.publish_artifact_registry == 'true' }}
        env:
          GCP_PROJECT_ID: ${{ inputs.gcp_project_id }}
          ARTIFACT_REGISTRY_LOCATION: ${{ inputs.artifact_registry_location }}
          ARTIFACT_REGISTRY_REPOSITORY: ${{ inputs.artifact_registry_repository }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$GCP_WORKLOAD_IDENTITY_PROVIDER" ]; then
            echo "::error::Missing GitHub Actions secret: GCP_WORKLOAD_IDENTITY_PROVIDER"
            exit 1
          fi

          if [ -z "$GCP_SERVICE_ACCOUNT" ]; then
            echo "::error::Missing GitHub Actions secret: GCP_SERVICE_ACCOUNT"
            exit 1
          fi

          if [ -z "$GCP_PROJECT_ID" ]; then
            echo "::error::Missing workflow input: gcp_project_id"
            exit 1
          fi

          if [ -z "$ARTIFACT_REGISTRY_LOCATION" ]; then
            echo "::error::Missing workflow input: artifact_registry_location"
            exit 1
          fi

          if [ -z "$ARTIFACT_REGISTRY_REPOSITORY" ]; then
            echo "::error::Missing workflow input: artifact_registry_repository"
            exit 1
          fi

      - name: Authenticate to Google Cloud for Artifact Registry
        if: ${{ inputs.publish_artifact_registry == 'true' }}
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ inputs.gcp_project_id }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        if: ${{ inputs.publish_artifact_registry == 'true' }}
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        if: ${{ inputs.publish_artifact_registry == 'true' }}
        env:
          ARTIFACT_REGISTRY_LOCATION: ${{ inputs.artifact_registry_location }}
        run: |
          gcloud auth configure-docker "${ARTIFACT_REGISTRY_LOCATION}-docker.pkg.dev" --quiet

      - name: Tag Artifact Registry image
        if: ${{ inputs.publish_artifact_registry == 'true' }}
        env:
          GCP_PROJECT_ID: ${{ inputs.gcp_project_id }}
          ARTIFACT_REGISTRY_LOCATION: ${{ inputs.artifact_registry_location }}
          ARTIFACT_REGISTRY_REPOSITORY: ${{ inputs.artifact_registry_repository }}
        run: |
          artifact_registry_image="${ARTIFACT_REGISTRY_LOCATION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REGISTRY_REPOSITORY}/modelopslab-serving"
          docker tag modelopslab-serving:${{ github.sha }} "${artifact_registry_image}:${{ github.sha }}"

      - name: Push Artifact Registry image
        if: ${{ inputs.publish_artifact_registry == 'true' }}
        env:
          GCP_PROJECT_ID: ${{ inputs.gcp_project_id }}
          ARTIFACT_REGISTRY_LOCATION: ${{ inputs.artifact_registry_location }}
          ARTIFACT_REGISTRY_REPOSITORY: ${{ inputs.artifact_registry_repository }}
        run: |
          artifact_registry_image="${ARTIFACT_REGISTRY_LOCATION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REGISTRY_REPOSITORY}/modelopslab-serving"
          docker push "${artifact_registry_image}:${{ github.sha }}"

  cloud-run-deploy:
    name: cloud run deploy
    runs-on: ubuntu-latest
    needs: docker-image
    if: ${{ inputs.deploy_cloud_run == 'true' }}
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Cloud Run deployment inputs
        env:
          PUBLISH_IMAGE: ${{ inputs.publish_image }}
          PUBLISH_ARTIFACT_REGISTRY: ${{ inputs.publish_artifact_registry }}
          CLOUD_RUN_IMAGE_SOURCE: ${{ inputs.cloud_run_image_source }}
          GCP_PROJECT_ID: ${{ inputs.gcp_project_id }}
          CLOUD_RUN_SERVICE: ${{ inputs.cloud_run_service }}
          CLOUD_RUN_REGION: ${{ inputs.cloud_run_region }}
          ARTIFACT_REGISTRY_LOCATION: ${{ inputs.artifact_registry_location }}
          ARTIFACT_REGISTRY_REPOSITORY: ${{ inputs.artifact_registry_repository }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: |
          if [ "$CLOUD_RUN_IMAGE_SOURCE" != "dockerhub" ] && [ "$CLOUD_RUN_IMAGE_SOURCE" != "artifact_registry" ]; then
            echo "::error::cloud_run_image_source must be dockerhub or artifact_registry"
            exit 1
          fi

          if [ "$CLOUD_RUN_IMAGE_SOURCE" = "dockerhub" ]; then
            if [ "$PUBLISH_IMAGE" != "true" ]; then
              echo "::error::deploy_cloud_run=true with cloud_run_image_source=dockerhub requires publish_image=true"
              exit 1
            fi

            if [ -z "$DOCKERHUB_USERNAME" ]; then
              echo "::error::Missing GitHub Actions secret: DOCKERHUB_USERNAME"
              exit 1
            fi
          fi

          if [ "$CLOUD_RUN_IMAGE_SOURCE" = "artifact_registry" ]; then
            if [ "$PUBLISH_ARTIFACT_REGISTRY" != "true" ]; then
              echo "::error::deploy_cloud_run=true with cloud_run_image_source=artifact_registry requires publish_artifact_registry=true"
              exit 1
            fi

            if [ -z "$ARTIFACT_REGISTRY_LOCATION" ]; then
              echo "::error::Missing workflow input: artifact_registry_location"
              exit 1
            fi

            if [ -z "$ARTIFACT_REGISTRY_REPOSITORY" ]; then
              echo "::error::Missing workflow input: artifact_registry_repository"
              exit 1
            fi
          fi

          if [ -z "$GCP_WORKLOAD_IDENTITY_PROVIDER" ]; then
            echo "::error::Missing GitHub Actions secret: GCP_WORKLOAD_IDENTITY_PROVIDER"
            exit 1
          fi

          if [ -z "$GCP_SERVICE_ACCOUNT" ]; then
            echo "::error::Missing GitHub Actions secret: GCP_SERVICE_ACCOUNT"
            exit 1
          fi

          if [ -z "$GCP_PROJECT_ID" ]; then
            echo "::error::Missing workflow input: gcp_project_id"
            exit 1
          fi

          if [ -z "$CLOUD_RUN_SERVICE" ]; then
            echo "::error::Missing workflow input: cloud_run_service"
            exit 1
          fi

          if [ -z "$CLOUD_RUN_REGION" ]; then
            echo "::error::Missing workflow input: cloud_run_region"
            exit 1
          fi

      - name: Resolve Cloud Run image
        id: cloud-run-image
        env:
          CLOUD_RUN_IMAGE_SOURCE: ${{ inputs.cloud_run_image_source }}
          GCP_PROJECT_ID: ${{ inputs.gcp_project_id }}
          ARTIFACT_REGISTRY_LOCATION: ${{ inputs.artifact_registry_location }}
          ARTIFACT_REGISTRY_REPOSITORY: ${{ inputs.artifact_registry_repository }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ "$CLOUD_RUN_IMAGE_SOURCE" = "artifact_registry" ]; then
            image="${ARTIFACT_REGISTRY_LOCATION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REGISTRY_REPOSITORY}/modelopslab-serving:${{ github.sha }}"
          else
            image="docker.io/${DOCKERHUB_USERNAME}/modelopslab-serving:${{ github.sha }}"
          fi

          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Resolved Cloud Run image: $image"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ inputs.gcp_project_id }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ inputs.cloud_run_service }}
          region: ${{ inputs.cloud_run_region }}
          project_id: ${{ inputs.gcp_project_id }}
          image: ${{ steps.cloud-run-image.outputs.image }}
          env_vars: |-
            MODELOPSLAB_ENV=cloud-run
            SERVING_HOST=0.0.0.0
            SERVING_PORT=8000
            LOG_LEVEL=info
            MODEL_REGISTRY_DIR=model_registry
            MLFLOW_RUNS_DIR=mlruns
            PREDICTION_LOG_PATH=logs/predictions.jsonl
            APP_LOG_PATH=logs/modelopslab.log
          flags: "--allow-unauthenticated --port=8000"

      - name: Validate deployed health endpoint
        env:
          CLOUD_RUN_URL: ${{ steps.deploy.outputs.url }}
        run: |
          if [ -z "$CLOUD_RUN_URL" ]; then
            echo "::error::Cloud Run deployment did not return a service URL"
            exit 1
          fi

          health_url="${CLOUD_RUN_URL%/}/health"
          echo "Checking $health_url"
          response="$(curl --fail --silent --show-error "$health_url")"
          echo "$response"
          echo "$response" | python -c "import json, sys; payload = json.load(sys.stdin); assert payload.get('status') == 'ok'; assert payload.get('service') == 'modelopslab-serving'"

      - name: Report Cloud Run URL
        run: |
          echo "Cloud Run URL: ${{ steps.deploy.outputs.url }}"
