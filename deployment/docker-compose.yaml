services:
  modelopslab-serving:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    image: modelopslab-serving:v8-c3
    env_file:
      - ../.env.example
    ports:
      - "8000:8000"
    volumes:
      - ../model_registry:/app/model_registry:ro
      - ../mlruns:/app/mlruns:ro
      - ../logs:/app/logs
    environment:
      MODELOPSLAB_ENV: ${MODELOPSLAB_ENV:-local}
      SERVING_HOST: ${SERVING_HOST:-0.0.0.0}
      SERVING_PORT: ${SERVING_PORT:-8000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DEPLOYMENT_VERSION: ${DEPLOYMENT_VERSION:-local}
      MODEL_REGISTRY_DIR: /app/model_registry
      MLFLOW_RUNS_DIR: /app/mlruns
      PREDICTION_LOG_PATH: /app/logs/predictions.jsonl
      APP_LOG_PATH: /app/logs/modelopslab.log
    restart: unless-stopped
