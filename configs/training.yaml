dataset:
  path: data/churn.csv
  target_column: churn
  drop_columns:
    - customer_id

dataset_version:
  metadata_path: data_versions/customer_churn/v1.yaml

training:
  test_size: 0.2
  random_state: 42

model:
  type: logistic_regression
  params:
    max_iter: 200

experiment_candidates:
  - name: logistic_regression_baseline
    model:
      type: logistic_regression
      params:
        max_iter: 200
  - name: decision_tree_baseline
    model:
      type: decision_tree
      params:
        max_depth: 4
        random_state: 42
  - name: random_forest_baseline
    model:
      type: random_forest
      params:
        n_estimators: 50
        random_state: 42

champion_selection:
  report_path: reports/champion_run.json
  primary_metric: f1

artifacts:
  dir: artifacts
  model_file: model.pkl
  metrics_file: metrics.json
  confusion_matrix_file: confusion_matrix.json
  config_snapshot_file: config_snapshot.json
  metadata_file: training_metadata.json

logging:
  dir: logs
  file: modelopslab.log

experiment_tracking:
  experiment_name: customer_churn_baseline
  tracking_uri: sqlite:///mlflow.db

validation:
  schema_path: schema_versions/customer_churn_v1.yaml
  reports:
    dir: reports
    json_file: validation_report.json
    summary_file: validation_summary.txt
